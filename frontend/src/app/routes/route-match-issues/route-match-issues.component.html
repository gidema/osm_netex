<div class="card my-5">
  @if (match) {
  <div class="card-body">
    <h2 i18n="@@CheckingOSMRoute">Checking OSM route {{ match.osmRoute?.name }}</h2>
    <p>
    @for (issue of match.issues; track issue.id) {
      @if(! $first) { <br/> }
      <app-route-issue [issue]=issue/>
    }
    @empty {
        <p i18n>No issues were found for this route.</p>
    }
    </p>
  </div>
}
</div>
